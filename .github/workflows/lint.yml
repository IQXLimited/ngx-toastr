name: Lint and Type Check

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0

      - name: Install dependencies
        run: npm i

      - name: Run lint
        run: npm run lint

      - name: Run tsc-verify
        run: npm run tsc-verify
